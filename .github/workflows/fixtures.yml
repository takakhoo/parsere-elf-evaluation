name: Benign ELF reproduction
on: [push, pull_request, workflow_dispatch]
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-reproduce.txt
      - run: python -m unittest discover -s tests -v
      - run: python reproduce_fixtures.py && git diff --exit-code -- results/fixtures.json
      - run: sudo apt-get update && sudo apt-get install -y libelf-dev zlib1g-dev qemu-user graphviz
      - run: gcc -Wl,-z,now -no-pie -g -O0 -fno-inline -static harnesses/elf_harness.c -lelf -lz -o /tmp/parsere-elf-harness
      - run: python parsere/main.py --target-path /tmp/parsere-elf-harness --format elf --qemu-path /usr/bin/qemu-x86_64 --addr2line-path /usr/bin/addr2line
      - uses: actions/upload-artifact@v4
        with:
          name: fresh-elf-translation-graph
          path: |
            out.dot
            out.svg
            parsere.out
            results/fixtures.json
